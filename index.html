<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d4aff">
<meta name="description" content="Código Siurot: aprende a programar guiando a Bit por mundos llenos de retos. CEIP Manuel Siurot.">
<title>Código Siurot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="iconos/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="iconos/icon-192.png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Código Siurot">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* =========================================================
   CÓDIGO SIUROT · estilos
   ========================================================= */
@property --c1{syntax:'<color>';inherits:true;initial-value:#62b8ff}
@property --c2{syntax:'<color>';inherits:true;initial-value:#cdb8ff}
@property --h1{syntax:'<color>';inherits:true;initial-value:#9be6b4}
@property --h2{syntax:'<color>';inherits:true;initial-value:#5fcf8f}
@property --h3{syntax:'<color>';inherits:true;initial-value:#3fb378}

:root{
  --ink:#1f1b4d; --ink2:#5b5788; --linea:#e7e3ff; --card:#ffffff;
  --pri:#6d4aff; --priD:#4527c9; --ok:#22c55e; --okD:#15803d; --bad:#f43f5e; --badD:#be123c;
  --oro:#fbbf24; --oroD:#d97706;
  --F:#3b82f6; --FD:#1d4ed8; --L:#f97316; --LD:#c2410c; --R:#a855f7; --RD:#7e22ce;
  --REP:#10b981; --REPD:#047857; --HAT:#facc15; --HATD:#ca8a04;
  --rad:24px; --sombra:0 10px 30px rgba(31,27,77,.18);
  --font:'Fredoka','Baloo 2','Nunito','Trebuchet MS',system-ui,sans-serif;
  --mc1:#86efac; --mc2:#22c55e; --mD:#15803d;
}
body[data-tema=menu]    {--c1:#5aaeff;--c2:#cdb6ff;--h1:#a7ebc0;--h2:#6fd59a;--h3:#45b97c}
body[data-tema=pradera] {--c1:#4fb8ff;--c2:#d6f5ff;--h1:#b6ec8c;--h2:#7fd35f;--h3:#4fb043}
body[data-tema=desierto]{--c1:#ff8f5a;--c2:#ffe2a6;--h1:#f7c983;--h2:#e8a258;--h3:#c97a37}
body[data-tema=hielo]   {--c1:#6f9cff;--c2:#e6efff;--h1:#eef5ff;--h2:#c7dcfb;--h3:#9dbcef}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--font); color:var(--ink); font-size:18px; line-height:1.3;
  background:var(--c2); overflow-x:hidden;
  transition:--c1 1s ease,--c2 1s ease,--h1 1s ease,--h2 1s ease,--h3 1s ease;
  -webkit-user-select:none; user-select:none; touch-action:manipulation;
}
input{-webkit-user-select:text;user-select:text}
button{font-family:inherit;color:inherit}
svg{display:block}
h1,h2,h3{margin:0;font-weight:700}

/* ---------- cielo animado ---------- */
#cielo{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 78%)}
#cielo .sol{position:absolute;right:7%;top:6%;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,#fffbe0 0 34%,#ffe680 52%,rgba(255,230,128,.35) 62%,rgba(255,230,128,0) 72%);
  animation:latido 7s ease-in-out infinite;transition:opacity 1s,transform 1s}
body[data-tema=desierto] #cielo .sol{transform:scale(1.5);background:radial-gradient(circle,#fff6d0 0 30%,#ffb347 50%,rgba(255,140,60,.35) 62%,rgba(255,140,60,0) 72%)}
body[data-tema=hielo] #cielo .sol{opacity:.55}
@keyframes latido{50%{filter:brightness(1.12)}}
.nube{position:absolute;left:-300px;width:200px;height:58px;background:#fff;border-radius:60px;opacity:.9;
  animation:nube linear infinite;filter:drop-shadow(0 6px 0 rgba(120,110,200,.12))}
.nube::before,.nube::after{content:"";position:absolute;background:#fff;border-radius:50%}
.nube::before{width:92px;height:92px;left:28px;top:-46px}
.nube::after{width:68px;height:68px;left:102px;top:-30px}
body[data-tema=desierto] .nube{opacity:.55}
@keyframes nube{to{transform:translateX(calc(100vw + 600px))}}
#cielo .colinas{position:absolute;left:0;right:0;bottom:0;width:100%;height:34vh}
#cielo .colinas .c1{fill:var(--h1)} #cielo .colinas .c2{fill:var(--h2)} #cielo .colinas .c3{fill:var(--h3)}
.mota{position:absolute;top:-30px;pointer-events:none;opacity:0}
body[data-tema=menu] .mota{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff;animation:brilla 4s ease-in-out infinite}
body[data-tema=pradera] .mota{width:12px;height:8px;border-radius:60% 0 60% 0;background:#ffb3d1;animation:petalo linear infinite}
body[data-tema=desierto] .mota{width:5px;height:5px;border-radius:50%;background:#fff3d6;animation:arena linear infinite}
body[data-tema=hielo] .mota{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:nieve linear infinite}
@keyframes brilla{0%,100%{opacity:0;transform:translateY(var(--y)) scale(.4)}50%{opacity:.9;transform:translateY(var(--y)) scale(1)}}
@keyframes petalo{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:.9}100%{opacity:.8;transform:translate(120px,105vh) rotate(720deg)}}
@keyframes nieve{0%{opacity:0;transform:translate(0,0)}10%{opacity:.95}50%{transform:translate(30px,52vh)}100%{opacity:.8;transform:translate(-10px,105vh)}}
@keyframes arena{0%{opacity:0;transform:translate(-20vw,var(--y))}15%{opacity:.8}100%{opacity:0;transform:translate(110vw,calc(var(--y) + 8vh))}}

/* ---------- estructura ---------- */
#app{min-height:100vh;min-height:100dvh;max-width:1560px;margin:0 auto;padding:12px 16px 22px;display:flex;flex-direction:column}
#vista{flex:1;display:flex;flex-direction:column;min-height:0}
.entra{animation:entra .42s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes entra{from{opacity:0;transform:translateY(16px) scale(.985)}}
body.en-juego #app{height:100vh;height:100dvh;padding-bottom:12px}

.panel{background:rgba(255,255,255,.95);border-radius:var(--rad);box-shadow:var(--sombra)}

/* ---------- barra superior ---------- */
.barra{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:56px;flex-wrap:wrap}
.barra .titulo{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.barra .extra{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.95);padding:9px 18px;border-radius:999px;
  font-weight:600;font-size:1.15rem;box-shadow:0 6px 18px rgba(31,27,77,.14);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pill svg{width:24px;height:24px;flex:none}
.ic{display:inline-flex;vertical-align:-4px}
.ic svg{width:22px;height:22px}
.pill .punto{width:14px;height:14px;border-radius:50%;background:var(--mc2);box-shadow:0 0 0 4px color-mix(in srgb,var(--mc2) 30%,transparent);flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.95);border-radius:999px;padding:8px 14px;font-weight:600;
  box-shadow:0 4px 14px rgba(31,27,77,.12);white-space:nowrap;font-size:1rem}
.chip svg{width:20px;height:20px}
.chip.oro{background:linear-gradient(#fff7d6,#ffe9a3);color:#8a5a00}
.chip.fuego{background:linear-gradient(#ffe8d6,#ffd0a8);color:#9a3412}
.redondo{width:54px;height:54px;border-radius:50%;background:#fff;border:0;cursor:pointer;flex:none;display:grid;place-items:center;color:var(--priD);
  box-shadow:0 5px 0 #d4ccff,0 10px 20px rgba(31,27,77,.16);transition:transform .08s,box-shadow .08s}
.redondo svg{width:26px;height:26px}
.redondo:hover{transform:translateY(-1px)}
.redondo:active{transform:translateY(4px);box-shadow:0 1px 0 #d4ccff,0 4px 10px rgba(31,27,77,.16)}
.redondo.peq{width:46px;height:46px}
.redondo.peq svg{width:22px;height:22px}
.redondo.off{color:#a3a0c2}
.redondo.off::after{content:"";position:absolute;width:30px;height:4px;background:#f43f5e;border-radius:3px;transform:rotate(-45deg)}
.redondo{position:relative}
.sonidos{display:flex;gap:8px}

/* ---------- botones ---------- */
.btn{--bg:#fff;--bd:#d4ccff;--fg:var(--priD);
  position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  padding:16px 22px;border:0;border-radius:20px;background:var(--bg);color:var(--fg);cursor:pointer;
  font:600 1.18rem/1.1 var(--font);text-align:center;
  box-shadow:0 6px 0 var(--bd),0 12px 24px rgba(31,27,77,.18);transition:transform .08s,box-shadow .08s,filter .15s}
.btn::before{content:"";position:absolute;left:10px;right:10px;top:5px;height:38%;border-radius:14px;
  background:linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,0));pointer-events:none}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(31,27,77,.18)}
.btn svg{width:26px;height:26px;flex:none}
.btn-ok{--bg:linear-gradient(#3ee07f,#1fb455);--bd:#138a3f;--fg:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn-pri{--bg:linear-gradient(#9378ff,#6d4aff);--bd:#4527c9;--fg:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn-oro{--bg:linear-gradient(#ffd75e,#fbb417);--bd:#c27803;--fg:#5b3600}
.btn-rojo{--bg:linear-gradient(#ff7088,#f43f5e);--bd:#be123c;--fg:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn-gris{--bg:#fff;--bd:#cbd5e1;--fg:#475569}
.btn[disabled]{filter:grayscale(.7);opacity:.5;pointer-events:none}
.btn.grande{font-size:1.4rem;padding:20px 26px;border-radius:24px}
.btn.mini{flex-direction:column;gap:3px;width:auto;min-width:78px;padding:9px 10px 8px;font-size:.82rem;border-radius:16px}
.btn.mini svg{width:28px;height:28px}
.btn.mini .em{font-size:1.6rem;line-height:1}
.enlace{background:none;border:0;color:var(--ink2);text-decoration:underline;font-size:.95rem;cursor:pointer;padding:8px}

/* ---------- inicio ---------- */
.home{flex:1;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:24px;padding:10px 0}
.home-izq{position:relative;display:flex;flex-direction:column;align-items:center}
#robotHome{width:min(440px,86vw);height:min(440px,86vw);cursor:pointer}
.globo-home{position:absolute;top:2%;left:58%;max-width:230px;background:#fff;border-radius:20px;padding:10px 14px;font-weight:600;
  box-shadow:var(--sombra);opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s cubic-bezier(.2,.9,.3,1.4);pointer-events:none}
.globo-home.ver{opacity:1;transform:scale(1)}
.globo-home::after{content:"";position:absolute;left:18px;bottom:-12px;border:12px solid transparent;border-top-color:#fff;border-bottom:0}
.colores{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:4px;background:rgba(255,255,255,.7);padding:10px 14px;border-radius:999px;box-shadow:0 6px 16px rgba(31,27,77,.1)}
.colores button{width:36px;height:36px;border-radius:50%;border:4px solid #fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15);transition:transform .15s}
.colores button.on{transform:scale(1.22);box-shadow:0 0 0 3px var(--ink),0 3px 0 rgba(0,0,0,.15)}
.colores-tit{font-size:.9rem;color:var(--ink2);font-weight:600;margin-top:10px}
.home-der{display:flex;flex-direction:column;align-items:stretch;gap:6px;max-width:500px;width:100%;justify-self:center}
.logo-cole{display:block;margin:0 auto 6px;width:clamp(84px,11vw,120px);height:auto;filter:drop-shadow(0 6px 0 rgba(31,27,77,.18))}
.logo{font-size:clamp(3rem,6.6vw,5.4rem);line-height:.92;margin:0 0 10px;text-align:center;letter-spacing:1px}
.logo .fila{display:block;white-space:nowrap}
.logo span{display:inline-block;color:#fff;animation:letra 2.6s ease-in-out infinite;animation-delay:calc(var(--i) * .09s);
  text-shadow:0 5px 0 var(--priD),0 10px 0 rgba(31,27,77,.22)}
.logo .f2 span{color:#ffe14d;text-shadow:0 5px 0 #d97706,0 10px 0 rgba(31,27,77,.22)}
@keyframes letra{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-8px) rotate(-3deg)}}
.lema{text-align:center;font-weight:500;font-size:1.15rem;color:#fff;text-shadow:0 2px 0 rgba(31,27,77,.25);margin-bottom:14px}
.home-der .btn{margin:7px 0}
.saludo{text-align:center;background:rgba(255,255,255,.92);border-radius:20px;padding:12px;box-shadow:var(--sombra);font-size:1.2rem;margin-bottom:6px}
.saludo b{color:var(--priD)}
.nota{text-align:center;color:var(--ink2);font-size:.92rem;background:rgba(255,255,255,.75);border-radius:16px;padding:10px 14px;margin-top:8px}
.firma{position:fixed;left:16px;bottom:10px;font-size:.8rem;color:rgba(31,27,77,.55);font-weight:500;pointer-events:none}

/* ---------- login ---------- */
.login{max-width:460px;width:100%;margin:86px auto 0;padding:28px 26px 22px;text-align:center}
.login img{width:130px;height:130px;margin:-80px auto 4px;animation:flota 3.4s ease-in-out infinite;filter:drop-shadow(0 12px 10px rgba(31,27,77,.25))}
.login h2{font-size:1.8rem;color:var(--priD);margin-bottom:6px}
.login p{color:var(--ink2);margin:0 0 10px}
.campo{text-align:left;margin:14px 0}
.campo label{display:block;font-weight:600;margin:0 0 6px 6px}
.campo input{width:100%;font:500 1.3rem var(--font);padding:14px 16px;border:3px solid var(--linea);border-radius:16px;background:#faf9ff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.campo input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 5px rgba(109,74,255,.15)}
.con-ojo{position:relative}
.con-ojo input{padding-right:64px}
.ojo{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:48px;height:44px;border:0;border-radius:12px;background:#efeaff;color:var(--priD);cursor:pointer;display:grid;place-items:center}
.ojo svg{width:26px;height:26px}
@keyframes flota{50%{transform:translateY(-10px)}}

/* ---------- mapa de mundos ---------- */
.resumen{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px}
.mundos{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;padding:4px 2px 20px}
.mundo{--mc1:#86efac;--mc2:#22c55e;--mD:#15803d;
  border:0;padding:0;text-align:left;cursor:pointer;background:#fff;border-radius:28px;overflow:hidden;font:inherit;color:inherit;
  display:flex;flex-direction:column;box-shadow:0 8px 0 var(--mD),0 20px 34px rgba(31,27,77,.22);transition:transform .18s cubic-bezier(.2,.9,.3,1.3)}
.mundo:hover{transform:translateY(-6px) rotate(-.6deg)}
.mundo:active{transform:translateY(5px);box-shadow:0 3px 0 var(--mD),0 8px 14px rgba(31,27,77,.2)}
.mundo .ilus{position:relative;height:190px;background:radial-gradient(circle at 50% 120%,rgba(255,255,255,.7),transparent 60%),linear-gradient(160deg,var(--mc1),var(--mc2));display:grid;place-items:center;overflow:hidden}
.mundo .ilus img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain;animation:flota 5s ease-in-out infinite;filter:drop-shadow(0 10px 8px rgba(0,0,0,.18))}
.mundo .num{position:absolute;left:14px;top:12px;background:#fff;color:var(--mD);font-weight:700;border-radius:999px;padding:5px 14px;box-shadow:0 3px 0 rgba(0,0,0,.12);z-index:1}
.mundo .info{padding:14px 18px 18px;display:flex;flex-direction:column;gap:4px}
.mundo h3{font-size:1.45rem;color:var(--mD)}
.mundo .concepto{color:var(--ink2);font-weight:500}
.mundo .fila{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;font-weight:600}
.barra-prog{height:14px;background:#efeef8;border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.08)}
.barra-prog i{display:block;height:100%;background:linear-gradient(90deg,#fde047,#f59e0b);border-radius:99px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.mundo.bloq{cursor:default;box-shadow:0 8px 0 #94a3b8,0 16px 24px rgba(31,27,77,.12)}
.mundo.bloq:hover{transform:none}
.mundo.bloq .ilus{background:repeating-linear-gradient(135deg,#e2e8f0 0 16px,#edf1f6 16px 32px)}
.mundo.bloq .ilus .em{font-size:5rem;filter:grayscale(1);opacity:.45}
.mundo.bloq .candado{position:absolute;inset:auto auto 14px 50%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;color:#64748b;box-shadow:0 4px 10px rgba(0,0,0,.1)}
.mundo.bloq h3,.mundo.bloq .num{color:#64748b}

/* ---------- pantalla de un mundo ---------- */
.mundo-cab{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:center;padding:14px 20px 14px 14px;margin-bottom:14px;overflow:hidden}
.mundo-cab .mini-ilus{position:relative;height:150px;border-radius:20px;background:linear-gradient(160deg,var(--mc1),var(--mc2));display:grid;place-items:center;overflow:hidden}
.mundo-cab .mini-ilus img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:contain;animation:flota 5s ease-in-out infinite}
.mundo-cab h2{font-size:1.8rem;color:var(--mD)}
.mundo-cab p{margin:6px 0;color:var(--ink2);font-size:1.05rem}
.mini-bloques{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.mini-bloques .blk{min-height:38px;padding:6px 12px;font-size:.95rem;cursor:default}
.mini-bloques .blk::after{display:none}
.camino{position:relative;display:flex;align-items:center;justify-content:center;gap:0;padding:34px 8px 44px;flex-wrap:nowrap}
.enlace-nodo{flex:0 1 52px;height:10px;min-width:12px;border-radius:99px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.95) 0 12px,transparent 12px 20px);filter:drop-shadow(0 2px 0 rgba(31,27,77,.15))}
.nodo{--t:clamp(66px,12vw,116px);width:var(--t);height:var(--t);flex:none;border-radius:50%;border:0;cursor:pointer;position:relative;
  background:radial-gradient(circle at 35% 28%,#fff 0 30%,#ece8ff 70%);color:var(--mD);font:700 calc(var(--t) * .4) var(--font);
  box-shadow:inset 0 0 0 7px var(--mc2),0 8px 0 var(--mD),0 18px 26px rgba(31,27,77,.22);transition:transform .15s cubic-bezier(.2,.9,.3,1.4)}
.nodo:hover{transform:translateY(-5px) scale(1.04)}
.nodo:active{transform:translateY(4px)}
.nodo.hecho{background:radial-gradient(circle at 35% 28%,#fffbe5 0 30%,#ffe27a 75%)}
.nodo .est{position:absolute;left:50%;bottom:calc(var(--t) * -.28);transform:translateX(-50%);display:flex;gap:1px}
.nodo .est svg{width:calc(var(--t) * .26);height:calc(var(--t) * .26);filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.nodo .aqui{position:absolute;left:50%;top:calc(var(--t) * -.62);width:calc(var(--t) * .6);transform:translateX(-50%);animation:flota 1.6s ease-in-out infinite}
.portal{display:flex;align-items:center;gap:22px;width:100%;max-width:760px;margin:0 auto;padding:18px 22px;border:0;cursor:pointer;text-align:left;font:inherit;color:inherit;
  border-radius:28px;background:linear-gradient(120deg,#2a1f6b,#4b2fd1 55%,#8a5cff);color:#fff;box-shadow:0 8px 0 #1e1650,0 22px 34px rgba(31,27,77,.3);transition:transform .15s}
.portal:hover{transform:translateY(-4px)}
.portal:active{transform:translateY(5px);box-shadow:0 3px 0 #1e1650}
.portal .aro{position:relative;width:96px;height:96px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:3rem;font-weight:700}
.portal .aro::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#ff6fb5,#ffd23f,#3ee07f,#3b9bff,#a855f7,#ff6fb5);animation:gira 3s linear infinite;
  -webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%)}
.portal .aro::after{content:"";position:absolute;inset:12px;border-radius:50%;background:radial-gradient(circle,#fff6 0,#a78bfa33 50%,transparent 70%);animation:latido 2s ease-in-out infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.portal h3{font-size:1.6rem}
.portal p{margin:4px 0 0;opacity:.9}

/* ---------- juego ---------- */

.zona-tab{grid-area:tab;display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.lienzo{position:relative;flex:1;min-height:240px}
#tablero{position:absolute;inset:0;width:100%;height:100%}
.burbuja{position:relative;display:flex;gap:12px;align-items:center;background:#fff;border-radius:22px;padding:10px 12px 10px 10px;box-shadow:var(--sombra);min-height:66px;transition:background .3s}
.burbuja .avatar{width:52px;height:52px;flex:none;animation:flota 2.6s ease-in-out infinite}

.zona-caja{grid-area:caja;display:flex;flex-direction:column;min-height:0;overflow:auto}
.zona-caja h3,.prog-cab b{font-size:1.1rem;display:flex;align-items:center;gap:8px}
.zona-caja h3{padding:14px 16px 4px}
.paleta{display:flex;flex-direction:column;gap:14px;padding:12px 14px 18px}
.paleta .blk{width:100%;min-height:58px;font-size:1.06rem}
.paleta .blk:hover{transform:translateX(4px)}
.paleta .blk:active{transform:scale(.96)}
.paleta .blk.off{opacity:.4;filter:grayscale(.5)}
.caja-ayuda{margin:auto 14px 14px;font-size:.85rem;color:var(--ink2);background:#f6f4ff;border-radius:14px;padding:10px 12px}
.caja-ayuda kbd{font:600 .8rem var(--font);background:#fff;border:2px solid var(--linea);border-bottom-width:3px;border-radius:6px;padding:0 5px}

.zona-prog{grid-area:prog;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.prog-cab{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:2px dashed var(--linea);flex-wrap:wrap}

.contador.sobra{background:linear-gradient(#fff0db,#ffe0b3);color:#9a3412}
.area{flex:1;overflow:auto;padding:16px 16px 60px;background-color:#fbfaff;
  background-image:radial-gradient(#ddd8ff 1.5px,transparent 1.6px);background-size:22px 22px;border-radius:0 0 var(--rad) var(--rad);cursor:text}
.pila{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding-bottom:20px}

/* bloques tipo puzle */
.blk{--b:var(--F);--bd:var(--FD);
  position:relative;display:flex;align-items:center;gap:10px;padding:10px 16px 12px 12px;min-height:52px;
  border-radius:13px;border:0;background:var(--b);color:#fff;font:600 1.06rem/1.1 var(--font);text-align:left;cursor:pointer;
  text-shadow:0 1px 0 rgba(0,0,0,.22);box-shadow:inset 0 -5px 0 var(--bd),inset 0 2px 0 rgba(255,255,255,.25),0 4px 8px rgba(31,27,77,.16);
  transition:transform .12s,filter .12s,box-shadow .15s}
.blk::before{content:"";position:absolute;left:20px;top:0;width:28px;height:8px;border-radius:0 0 9px 9px;background:rgba(0,0,0,.16)}
.blk::after{content:"";position:absolute;left:20px;bottom:-9px;width:28px;height:11px;border-radius:0 0 10px 10px;background:var(--b);box-shadow:inset 0 -4px 0 var(--bd);z-index:1}
.blk .ico{width:32px;height:32px;flex:none;border-radius:10px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.blk .ico svg{width:22px;height:22px}
.blk .tecla{margin-left:auto;font-size:.75rem;background:rgba(0,0,0,.2);border-radius:7px;padding:3px 7px;text-shadow:none}
.b-F{--b:var(--F);--bd:var(--FD)} .b-L{--b:var(--L);--bd:var(--LD)} .b-R{--b:var(--R);--bd:var(--RD)} .b-REP{--b:var(--REP);--bd:var(--REPD)}
.blk.hat{--b:var(--HAT);--bd:var(--HATD);color:#5b3b00;text-shadow:none;border-radius:28px 28px 13px 13px;padding-top:16px;cursor:default;min-width:230px}
.blk.hat::before{display:none}
.pila .blk{min-width:210px}
.blk.sel{box-shadow:inset 0 -5px 0 var(--bd),0 0 0 4px #fff,0 0 0 7px var(--ink),0 6px 14px rgba(31,27,77,.25);z-index:3}
.blk.nuevo{animation:nuevo .38s cubic-bezier(.2,.9,.3,1.6)}
@keyframes nuevo{from{transform:scale(.4) translateY(-20px);opacity:0}}
.blk.exec{filter:brightness(1.15) saturate(1.1);transform:translateX(8px) scale(1.03);z-index:3;
  box-shadow:inset 0 -5px 0 var(--bd),0 0 0 4px #fff,0 0 0 8px #fde047,0 0 26px 6px rgba(253,224,71,.8)}

.blk.choca{animation:sacude .5s;box-shadow:inset 0 -5px 0 var(--bd),0 0 0 4px #fff,0 0 0 8px var(--bad),0 0 24px 6px rgba(244,63,94,.6);z-index:3}
.blk.marcado{animation:latePista 1s ease-in-out 3;box-shadow:inset 0 -5px 0 var(--bd),0 0 0 4px #fff,0 0 0 8px #facc15;z-index:3}
@keyframes latePista{50%{transform:scale(1.06)}}
@keyframes sacude{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.blk .x{position:absolute;right:-14px;top:-14px;width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:var(--bad);color:#fff;
  font:700 1.2rem/1 var(--font);cursor:pointer;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.3);z-index:4;animation:nuevo .25s}
.cursor{width:210px;height:7px;border-radius:7px;background:var(--pri);margin:5px 0 3px;box-shadow:0 0 0 3px rgba(109,74,255,.18),0 0 14px rgba(109,74,255,.6);animation:parpadeo 1.1s ease-in-out infinite;position:relative}
.cursor::after{content:"▸ aquí";position:absolute;left:218px;top:-9px;font-size:.78rem;font-weight:600;color:var(--pri);white-space:nowrap}
@keyframes parpadeo{50%{opacity:.35}}
.vacio-prog{color:var(--ink2);font-weight:500;padding:6px 4px;display:flex;align-items:center;gap:8px}
/* bloque Repetir en forma de C */
.rep{--b:var(--REP);--bd:var(--REPD);display:flex;flex-direction:column;align-items:flex-start;position:relative;min-width:250px}
.rep.sel>.rep-cab{box-shadow:inset 0 -5px 0 var(--bd),0 0 0 4px #fff,0 0 0 7px var(--ink)}

.rep-cab::after{left:40px}
.rep-cuerpo{align-self:stretch;margin-left:0;border-left:22px solid var(--b);padding:12px 12px 10px 14px;min-height:62px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;
  background:rgba(16,185,129,.07);position:relative;cursor:pointer;box-shadow:inset 6px 0 0 -2px rgba(0,0,0,.08)}

.rep-cuerpo .vacio-prog{font-size:.9rem}
.rep-pie{width:150px;height:24px;background:var(--b);border-radius:0 0 13px 13px;box-shadow:inset 0 -5px 0 var(--bd);position:relative}
.rep-pie::after{content:"";position:absolute;left:20px;bottom:-9px;width:28px;height:11px;border-radius:0 0 10px 10px;background:var(--b);box-shadow:inset 0 -4px 0 var(--bd)}
.veces{display:inline-flex;align-items:center;gap:4px;background:#fff;color:var(--REPD);border-radius:999px;padding:3px;text-shadow:none}

.juego.corriendo .paleta,.juego.corriendo [data-acc=quitar],.juego.corriendo [data-acc=vaciar],.juego.corriendo [data-acc=pista],.juego.corriendo [data-acc=otro]{opacity:.45;pointer-events:none;filter:grayscale(.4)}

.estrellas-grandes .e.gris{transform:scale(1);opacity:.25;filter:grayscale(1)}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.stat{background:#f4f2ff;border-radius:16px;padding:8px 14px;font-weight:600;color:var(--ink)}

.ejemplo-rep .blk{min-height:40px;font-size:.92rem;padding:6px 12px 9px;cursor:default;min-width:0}

function hashStr(s){ let h = 2166136261; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619); } return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rint = (rnd,a,b) => a + Math.floor(rnd()*(b-a+1));
const elegir = (rnd,arr) => arr[Math.floor(rnd()*arr.length)];

let _id = 0;
const nuevoId = () => 'n' + (++_id);
const nodo = t => ({t, id:nuevoId()});
const rep = (n,body) => ({t:'REP', n, body, id:nuevoId()});

function aplanar(prog,out){ out = out || []; for(const n of prog){ if(n.t==='REP'){ for(let i=0;i<n.n;i++) aplanar(n.body,out); } else out.push(n); } return out; }
function contar(prog){ let c = 0; for(const n of prog){ c++; if(n.t==='REP') c += contar(n.body); } return c; }

function trazar(pasos,dir0){
  let x=0,y=0,d=dir0; const cel=[[0,0]]; const vis=new Set(['0,0']);
  for(const s of pasos){
    if(s==='L') d=(d+3)%4; else if(s==='R') d=(d+1)%4;
    else { x+=DX[d]; y+=DY[d]; const k=x+','+y; if(vis.has(k)) return null; vis.add(k); cel.push([x,y]); }
  }
  return cel;
}
function colocar(cel,dir0,maxS,minS,rnd){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const [x,y] of cel){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  const w=x1-x0+1, h=y1-y0+1, n=Math.max(w,h,minS);
  if(n>maxS) return null;
  const ox=rint(rnd,0,n-w), oy=rint(rnd,0,n-h);
  const path=cel.map(([x,y])=>[x-x0+ox,y-y0+oy]);
  const ult=path[path.length-1];
  return {n, path, ini:{x:path[0][0],y:path[0][1],dir:dir0}, meta:{x:ult[0],y:ult[1]}};
}
function partir(rnd,total,partes){ const a=Array(partes).fill(1); let resto=total-partes; while(resto-->0) a[Math.floor(rnd()*partes)]++; return a; }

function genLineal(rnd,nF,nT,maxS,minS){
  for(let t=0;t<500;t++){
    const segs=partir(rnd,nF,nT+1), pasos=[];
    segs.forEach((s,i)=>{ if(i>0) pasos.push(rnd()<0.5?'L':'R'); for(let j=0;j<s;j++) pasos.push('F'); });
    const dir0=rint(rnd,0,3);
    const cel=trazar(pasos,dir0); if(!cel) continue;
    const col=colocar(cel,dir0,maxS,minS,rnd); if(!col) continue;
    return Object.assign(col,{ref:pasos.map(nodo), par:pasos.length});
  }
  return null;
}
function aleat(rnd,n){ const a=[]; for(let i=0;i<n;i++) a.push(elegir(rnd,['F','F','L','R'])); return a; }
function valida(p){ if(p[0]!=='F'||p[p.length-1]!=='F') return false; for(let i=1;i<p.length;i++) if(p[i]!=='F'&&p[i-1]!=='F') return false; return true; }
function genRepetir(rnd,pl,kmin,kmax,npre,nsuf,maxS,minS){
  for(let t=0;t<1500;t++){
    const pat=elegir(rnd,PAT[pl]), k=rint(rnd,kmin,kmax);
    const pre=aleat(rnd,npre), suf=aleat(rnd,nsuf);
    const pasos=pre.slice(); for(let i=0;i<k;i++) pasos.push(...pat); pasos.push(...suf);
    if(!valida(pasos)) continue;
    const dir0=rint(rnd,0,3);
    const cel=trazar(pasos,dir0); if(!cel) continue;
    const col=colocar(cel,dir0,maxS,minS,rnd); if(!col) continue;
    return Object.assign(col,{ref:[...pre.map(nodo), rep(k,pat.map(nodo)), ...suf.map(nodo)], par:npre+1+pat.length+nsuf});
  }
  return null;
}
// decoración: 0 = nada, 1..6 = tipo de objeto (cada mundo los dibuja a su manera)
function decorar(n,set,rnd){ const d=[]; for(let y=0;y<n;y++) for(let x=0;x<n;x++) d.push(set.has(x+','+y)?0:(rnd()<0.58?1+Math.floor(rnd()*6):0)); return d; }

// idx >= 0: reto fijo; idx = -1: laberinto aleatorio del modo infinito
function generar(nivel,idx,rnd){
  const c=CFG[nivel]; let lab=null;
  for(let ampliar=0; ampliar<3 && !lab; ampliar++){
    const maxS=c.maxS+ampliar;
    if(nivel===3){
      let f;
      if(idx>=0) f={pl:c.pat[idx],kmin:c.k[idx][0],kmax:c.k[idx][1],pre:c.pre[idx],suf:c.suf[idx]};
      else { const pl=rint(rnd,1,4); f={pl,kmin:c.kInf[pl][0],kmax:c.kInf[pl][1],pre:rint(rnd,0,2),suf:rint(rnd,0,2)}; }
      lab=genRepetir(rnd,f.pl,f.kmin,f.kmax,f.pre,f.suf,maxS,c.minS);
    } else {
      let nT,nF;
      if(idx>=0){ nT=c.nT[idx]; nF=c.nF[idx]; }
      else { nT=rint(rnd,c.inf.nT[0],c.inf.nT[1]); nF=rint(rnd,Math.max(nT+1,c.inf.nF[0]),Math.max(nT+1,c.inf.nF[1])); }
      lab=genLineal(rnd,nF,nT,maxS,c.minS);
    }
  }
  if(!lab && nivel===3) lab=genRepetir(rnd,1,4,5,0,0,99,5);   // plan B del nivel 3: una recta con Repetir
  let planB=false;
  if(!lab){ lab=genLineal(rnd,4,0,99,4); planB=true; }          // último recurso (no debería hacer falta)
  lab.planB=planB;
  lab.set=new Set(lab.path.map(p=>p[0]+','+p[1]));
  lab.nivel=nivel;
  lab.decor=decorar(lab.n,lab.set,rnd);

}

// un paso del robot: devuelve 'giro' | 'mov' | 'choque' | 'meta'
function dar(est,t,lab){
  if(t==='L'){ est.d=(est.d+3)%4; return 'giro'; }
  if(t==='R'){ est.d=(est.d+1)%4; return 'giro'; }
  const nx=est.x+DX[est.d], ny=est.y+DY[est.d];
  if(!lab.set.has(nx+','+ny)) return 'choque';
  est.x=nx; est.y=ny;
  return (nx===lab.meta.x && ny===lab.meta.y) ? 'meta' : 'mov';
}
function simular(lab,prog){
  const est={x:lab.ini.x,y:lab.ini.y,d:lab.ini.dir};
  for(const p of aplanar(prog)){
    const r=dar(est,p.t,lab);
    if(r==='choque') return {ok:false,motivo:'choque'};
    if(r==='meta') return {ok:true};
  }
  return {ok:false,motivo:'fin'};
}

function normalizarProg(p){
  const out={};
  for(const n of MUNDOS){
    const q=(p&&p[n.id])||{};
    const s=Array.isArray(q.s)?q.s.slice(0,RETOS):[];
    while(s.length<RETOS) s.push(0);
    out[n.id]={s:s.map(v=>Math.max(0,Math.min(3,v|0))), r:Math.max(0,Math.min(1000,q.r|0))};

}

}

let FB=null;

    const auth=app.auth(), db=app.firestore();
    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(()=>{});

// lee la ficha del alumno y mezcla su progreso con el de este ordenador
async function cargarAlumno(user){
  const d=await FB.db.doc('alumnos/'+user.uid).get();
  if(!d.exists){ await FB.auth.signOut().catch(()=>{}); return false; }
  const a=d.data();
  S.user={uid:user.uid,usuario:a.usuario,nombre:a.nombre||a.usuario,clase:a.clase};
  cargarPerfil();
  const rv=a.rv||0;
  if((S.rv||0)!==rv){ S.prog=normalizarProg({}); S.rv=rv; }   // el maestro reinició el progreso
  const srv=normalizarProg(a.prog);
  S.prog=mezclarProg(S.prog,srv);
  S.pend=JSON.stringify(S.prog)!==JSON.stringify(srv);
  nube=S.pend?'pend':'ok'; guardarPerfil();
  if(S.pend) programarSync(1500);
  return true;
}
let tSync=null, sincronizando=false;
function pintarNube(){
  $$('.nube-estado').forEach(el=>{
    el.innerHTML = nube==='ok' ? ICO.nubeOk+'<span>Guardado</span>' : nube==='pend' ? ICO.nube+'<span>Guardando…</span>' : ICO.nubeNo+'<span>Sin conexión</span>';
    el.title = nube==='err' ? 'No hay conexión: tu progreso está a salvo en este ordenador y se guardará después.' : '';
  });
}
function programarSync(ms){
  if(!S.user) return;
  S.pend=true; nube='pend'; guardarPerfil(); pintarNube();
  clearTimeout(tSync); tSync=setTimeout(()=>sincronizar(false), ms==null?6000:ms);
}
async function sincronizar(){
  const u=S.user;
  if(!u || !S.pend || sincronizando || !iniciarFirebase()) return;
  sincronizando=true;
  const foto=JSON.stringify(S.prog), prog=JSON.parse(foto);
  try{
    const b=FB.db.batch();
    b.update(FB.db.doc('alumnos/'+u.uid),{prog,act:TS()});
    b.set(FB.db.doc('publico/'+u.uid),publicoDe(u,prog));
    await b.commit();
    for(const k in hofCache) delete hofCache[k];
    if(S.user!==u) return;
    if(JSON.stringify(S.prog)===foto){ S.pend=false; nube='ok'; }
    else { S.pend=true; nube='pend'; clearTimeout(tSync); tSync=setTimeout(()=>sincronizar(),3000); }
    guardarPerfil(); pintarNube();
  }catch(e){
    if(S.user!==u) return;
    if(e&&e.code==='permission-denied'){ toast('Tu cuenta ya no está activa. Habla con tu maestro.'); cerrarSesion(); ir('home',{},true); return; }
    nube='err'; pintarNube(); clearTimeout(tSync); tSync=setTimeout(()=>sincronizar(),30000);
  } finally { sincronizando=false; }
}
window.addEventListener('online',()=>sincronizar());
function cerrarSesion(){
  const p=(S.user&&S.pend)?sincronizar():null;
  S.user=null; clearTimeout(tSync);
  cargarPerfil();
  Promise.resolve(p).catch(()=>{}).finally(()=>{ if(FB&&!S.user) FB.auth.signOut().catch(()=>{}); });
}

    const T=TEMAS[tema]||TEMAS.menu; const dur=60/T.bpm/2;
    if(sig<ac.currentTime) sig=ac.currentTime+.05;
    while(sig<ac.currentTime+.18){ tocar(T,paso,sig,dur); sig+=dur; paso=(paso+1)%T.mel.length; }
  }
  function arrancar(){ if(!ac||timer) return; sig=ac.currentTime+.1; timer=setInterval(programar,35); }
  function parar(){ clearInterval(timer); timer=null; }
  document.addEventListener('visibilitychange',()=>{
    if(!ac) return;
    if(document.visibilityState==='hidden'){ parar(); ac.suspend().catch(()=>{}); }
    else { ac.resume().catch(()=>{}); if(P.mus) arrancar(); }
  });
  return {
    despertar(){ if(init() && P.mus){ gM.gain.setTargetAtTime(.55,ac.currentTime,.4); arrancar(); } },
    fx(nombre,...a){ if(!P.sfx) return; if(!init()) return; try{ fx[nombre]&&fx[nombre](...a); }catch(e){} },
    setSfx(on){ P.sfx=!!on; guardarPrefs(); },
    setMusica(on){
      P.mus=!!on; guardarPrefs();
      if(!init()) return;
      if(on){ gM.gain.cancelScheduledValues(ac.currentTime); gM.gain.setTargetAtTime(.55,ac.currentTime,.4); arrancar(); }
      else { gM.gain.setTargetAtTime(0,ac.currentTime,.12); setTimeout(()=>{ if(!P.mus) parar(); },700); }
    },
    tema(n){
      if(!TEMAS[n]||n===tema) return;
      tema=n; paso=0;
      if(ac&&P.mus){ gM.gain.cancelScheduledValues(ac.currentTime); gM.gain.setValueAtTime(.12,ac.currentTime); gM.gain.setTargetAtTime(.55,ac.currentTime+.1,.6); }
    }
  };
})();

/* =========================================================
   VOZ (si el ordenador tiene voz en español)
   ========================================================= */
const VOZ = {
  v:null, ok:false,
  init(){
    if(!('speechSynthesis' in window)){ document.body.classList.add('sin-voz'); return; }
    const elegirVoz=()=>{
      const vs=speechSynthesis.getVoices()||[];
      this.v = vs.find(v=>/^es[-_]ES/i.test(v.lang)) || vs.find(v=>/^es/i.test(v.lang)) || null;
      this.ok=!!this.v; document.body.classList.toggle('sin-voz',!this.ok);
    };
    elegirVoz();
    try{ speechSynthesis.addEventListener('voiceschanged',elegirVoz); }catch(e){ speechSynthesis.onvoiceschanged=elegirVoz; }
  },
  decir(txt){
    if(!this.ok) return;
    try{
      speechSynthesis.cancel();
      const limpio=String(txt).replace(/<[^>]+>/g,'').replace(/[«»"]/g,'').replace(/[^\p{L}\p{N}\s.,;:¡!¿?()\-]/gu,'');
      const u=new SpeechSynthesisUtterance(limpio); u.voice=this.v; u.lang=this.v.lang; u.rate=.95; u.pitch=1.15;
      speechSynthesis.speak(u);
    }catch(e){}
  },
  callar(){ try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){} }
};

/* =========================================================
   DIBUJO: utilidades de canvas
   ========================================================= */
function rrect(c,x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function circ(c,x,y,r){ c.beginPath(); c.arc(x,y,Math.max(.1,r),0,Math.PI*2); }
function elip(c,x,y,rx,ry,rot){ c.beginPath(); c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,Math.PI*2); }
function pathEstrella(c,cx,cy,R,r,p){ p=p||5; c.beginPath(); for(let i=0;i<p*2;i++){ const a=-Math.PI/2+i*Math.PI/p, rr=i%2?r:R; c.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr); } c.closePath(); }
function destello(c,x,y,r){ c.beginPath(); c.moveTo(x,y-r); c.quadraticCurveTo(x,y,x+r,y); c.quadraticCurveTo(x,y,x,y+r); c.quadraticCurveTo(x,y,x-r,y); c.quadraticCurveTo(x,y,x,y-r); c.closePath(); }
function sombraSuelo(c,x,y,rx,ry,a){ c.fillStyle='rgba(30,22,70,'+(a||.2)+')'; elip(c,x,y,rx,ry); c.fill(); }
function copa(c,bolas,base,luz,osc){
  c.fillStyle=osc; for(const [x,y,r] of bolas){ circ(c,x,y+r*.18,r); c.fill(); }
  c.fillStyle=base; for(const [x,y,r] of bolas){ circ(c,x,y,r); c.fill(); }
  c.fillStyle=luz; for(const [x,y,r] of bolas){ circ(c,x-r*.3,y-r*.32,r*.45); c.fill(); }
}

/* =========================================================
   BIT, el robot (diseño propio)
   ========================================================= */
const OJO='#7cf6ff';
function dibujarRobot(c,cx,cy,s,o){
  o=o||{}; const col=o.col||COLORES[0], t=o.t||0, ang=o.ang||0;
  const v=((Math.round(ang/90)%4)+4)%4;          // 0 espalda · 1 derecha · 2 frente · 3 izquierda
  const hop=o.hop||0, sq=o.sq||0, fy=cy+s*.22;
  c.save();
  if(o.sombra!==false){ const k=clamp(1-hop/(s*.9),.45,1); sombraSuelo(c,cx,fy+s*.01,s*.24*k,s*.08*k,.28*k); }
  if(o.flecha){
    c.save(); c.translate(cx,cy+s*.04);
    c.fillStyle='rgba(255,255,255,.42)'; circ(c,0,0,s*.4); c.fill();
    c.rotate(ang*Math.PI/180);
    c.lineWidth=s*.035; c.strokeStyle=col.c; c.setLineDash([s*.08,s*.055]); c.lineDashOffset=-t*s*.15; circ(c,0,0,s*.4); c.stroke(); c.setLineDash([]);
    c.restore();
  }
  c.translate(cx,fy-hop); c.scale(1+sq,1-sq);
  const bw=s*.5, bh=s*.42, bb=-s*.09, bt=bb-bh;
  const mov=!!o.motor;
  const sw=o.brazo!=null?o.brazo:Math.sin(t*(mov?13:2.4))*(mov?.55:.14);
  // propulsor
  if(mov){
    const L=s*(.13+.04*Math.sin(t*45));
    const g=c.createLinearGradient(0,bb,0,bb+L+s*.05); g.addColorStop(0,'rgba(255,250,200,.95)'); g.addColorStop(.5,'rgba(255,160,40,.8)'); g.addColorStop(1,'rgba(255,90,20,0)');
    c.fillStyle=g; c.beginPath(); c.moveTo(-s*.07,bb+s*.02); c.quadraticCurveTo(0,bb+L*1.6,s*.07,bb+s*.02); c.closePath(); c.fill();
  }
  c.fillStyle=col.d; rrect(c,-s*.12,bb-s*.02,s*.24,s*.075,s*.035); c.fill();
  c.fillStyle='rgba(255,255,255,.25)'; rrect(c,-s*.09,bb-s*.012,s*.18,s*.018,s*.01); c.fill();
  if(v===2) frenteRobot(c,s,col,bw,bh,bt,t,o,sw);
  else if(v===0) espaldaRobot(c,s,col,bw,bh,bt,t,o,sw);
  else { if(v===3) c.scale(-1,1); perfilRobot(c,s,col,bw,bh,bt,t,o,sw); }
  c.restore();
}
function brazoRobot(c,x,y,s,col,ang){
  c.save(); c.translate(x,y); c.rotate(ang);
  c.fillStyle=col.d; rrect(c,-s*.034,-s*.02,s*.068,s*.17,s*.034); c.fill();
  c.fillStyle=col.c; c.strokeStyle=col.d; c.lineWidth=s*.02; circ(c,0,s*.17,s*.048); c.fill(); c.stroke();
  c.restore();
}
function cuerpoRobot(c,x,y,w,h,s,col){
  const g=c.createLinearGradient(0,y,0,y+h); g.addColorStop(0,aclarar(col.c,.3)); g.addColorStop(.55,col.c); g.addColorStop(1,oscurecer(col.c,.08));
  c.fillStyle=g; rrect(c,x,y,w,h,s*.15); c.fill();
  c.lineWidth=s*.026; c.strokeStyle=col.d; c.stroke();
  c.fillStyle='rgba(255,255,255,.4)'; rrect(c,x+s*.07,y+s*.03,w*.42,s*.05,s*.025); c.fill();
  c.fillStyle='rgba(0,0,0,.08)'; rrect(c,x+s*.03,y+h-s*.07,w-s*.06,s*.045,s*.02); c.fill();
}
function antenaRobot(c,x,y,s,t,inc){
  c.save(); c.translate(x,y); c.rotate(inc||0);
  c.strokeStyle='#4a4470'; c.lineWidth=s*.028; c.lineCap='round';
  c.beginPath(); c.moveTo(0,0); c.lineTo(0,-s*.12); c.stroke();
  c.shadowColor='#ffd23f'; c.shadowBlur=s*(.08+.05*Math.sin(t*4));
  c.fillStyle='#ffd23f'; circ(c,0,-s*.15,s*.048); c.fill();
  c.shadowBlur=0; c.fillStyle='rgba(255,255,255,.8)'; circ(c,-s*.015,-s*.165,s*.015); c.fill();
  c.restore();
}
function ojosRobot(c,xs,ey,s,expr,parp,mirar){
  const mx=(mirar&&mirar.x||0)*s*.025, my=(mirar&&mirar.y||0)*s*.02;
  c.save(); c.fillStyle=OJO; c.strokeStyle=OJO; c.lineCap='round'; c.lineWidth=s*.03;
  c.shadowColor=OJO; c.shadowBlur=s*.07;
  xs.forEach((ex,i)=>{
    ex+=mx; let y=ey+my;
    if(expr==='feliz'){ c.beginPath(); c.arc(ex,y+s*.03,s*.042,Math.PI*1.1,Math.PI*1.9); c.stroke(); }
    else if(expr==='mareado'){ const d=s*.033; c.beginPath(); c.moveTo(ex-d,y-d); c.lineTo(ex+d,y+d); c.moveTo(ex+d,y-d); c.lineTo(ex-d,y+d); c.stroke(); }
    else if(expr==='sorpresa'){ c.lineWidth=s*.025; circ(c,ex,y,s*.042); c.stroke(); }
    else if(expr==='triste'){ rrect(c,ex-s*.03,y-s*.03,s*.06,s*.07,s*.03); c.fill(); c.lineWidth=s*.022; c.beginPath(); c.moveTo(ex-s*.04,y-s*.075+(i?-s*.015:s*.015)); c.lineTo(ex+s*.04,y-s*.075+(i?s*.015:-s*.015)); c.stroke(); }
    else if(expr==='pensando'){ const h=i?s*.06:s*.1; rrect(c,ex-s*.03+s*.012,y-h/2-s*.02,s*.06,h,s*.03); c.fill(); }
    else if(parp){ rrect(c,ex-s*.035,y-s*.008,s*.07,s*.016,s*.008); c.fill(); }
    else { rrect(c,ex-s*.032,y-s*.055,s*.064,s*.11,s*.032); c.fill(); }
  });
  c.restore();
}
function bocaRobot(c,x,y,s,expr){
  c.save(); c.strokeStyle=OJO; c.fillStyle=OJO; c.lineWidth=s*.022; c.lineCap='round'; c.shadowColor=OJO; c.shadowBlur=s*.05;
  if(expr==='feliz'){ c.beginPath(); c.arc(x,y-s*.015,s*.05,0,Math.PI); c.closePath(); c.fill(); }
  else if(expr==='mareado'){ c.beginPath(); for(let i=0;i<=8;i++){ const xx=x-s*.05+i*s*.0125, yy=y+Math.sin(i*1.6)*s*.01; i?c.lineTo(xx,yy):c.moveTo(xx,yy); } c.stroke(); }
  else if(expr==='triste'){ c.beginPath(); c.arc(x,y+s*.03,s*.035,Math.PI*1.15,Math.PI*1.85); c.stroke(); }
  else if(expr==='sorpresa'){ circ(c,x,y,s*.02); c.stroke(); }
  else if(expr==='pensando'){ c.beginPath(); c.moveTo(x-s*.01,y); c.lineTo(x+s*.04,y-s*.008); c.stroke(); }
  else { c.beginPath(); c.arc(x,y-s*.025,s*.035,Math.PI*.18,Math.PI*.82); c.stroke(); }
  c.restore();
}
function frenteRobot(c,s,col,bw,bh,bt,t,o,sw){
  brazoRobot(c,-bw/2-s*.01,bt+bh*.42,s,col,.25+sw);
  brazoRobot(c,bw/2+s*.01,bt+bh*.42,s,col,o.saludo?-.25-o.saludo*2.4+Math.sin(t*12)*.25*o.saludo:-.25-sw);
  cuerpoRobot(c,-bw/2,bt,bw,bh,s,col);
  const pw=bw*.78, ph=bh*.6, px=-pw/2, py=bt+bh*.15;
  c.fillStyle='#1d1a3c'; rrect(c,px,py,pw,ph,s*.085); c.fill();
  c.strokeStyle='rgba(124,246,255,.25)'; c.lineWidth=s*.012; rrect(c,px+s*.012,py+s*.012,pw-s*.024,ph-s*.024,s*.07); c.stroke();
  c.fillStyle='rgba(255,255,255,.08)'; rrect(c,px+s*.03,py+s*.02,pw*.45,ph*.22,s*.04); c.fill();
  ojosRobot(c,[-pw*.22,pw*.22],py+ph*.42,s,o.expr,o.parp,o.mirar);
  bocaRobot(c,(o.mirar&&o.mirar.x||0)*s*.02,py+ph*.78,s,o.expr);
  c.fillStyle='rgba(255,130,170,.6)'; elip(c,-bw*.4,bt+bh*.86,s*.04,s*.022); c.fill(); elip(c,bw*.4,bt+bh*.86,s*.04,s*.022); c.fill();
  antenaRobot(c,0,bt,s,t,0);
}
function espaldaRobot(c,s,col,bw,bh,bt,t,o,sw){

  const lab=generar(m.id,m.id===3?4:3,mulberry32(hashStr('vista'+m.id)));
  const cv=document.createElement('canvas'); const tb=new Tablero(cv); tb.lab=lab; tb.tema=m.tema; tb.reset();

  return _vistas[m.id]=cv.toDataURL('image/png');
}

/* =========================================================
   CONFETI a pantalla completa
   ========================================================= */
const CONFETI = {
  p:[], raf:0, c:null, w:0, h:0,
  lanzar(n){
    const cv=$('#confeti'); if(!cv) return;
    const dpr=Math.min(2,window.devicePixelRatio||1);
    this.w=innerWidth; this.h=innerHeight; cv.width=this.w*dpr; cv.height=this.h*dpr;
    this.c=cv.getContext('2d'); this.c.setTransform(dpr,0,0,dpr,0,0);
    const cols=['#ffd43b','#ff6b9a','#4dabf7','#69db7c','#b197fc','#ffa94d','#ffffff'];
    n=n||140;
    for(let i=0;i<n;i++){
      const izq=i%2===0, bur=i<n*.6;
      this.p.push(bur
        ? {x:izq?-10:this.w+10,y:this.h*.75,vx:(izq?1:-1)*(5+Math.random()*9),vy:-(9+Math.random()*10),g:.32,rot:Math.random()*6,vr:(Math.random()-.5)*.4,w:8+Math.random()*7,h:5+Math.random()*5,col:cols[i%cols.length],vida:260,f:Math.random()*6}
        : {x:Math.random()*this.w,y:-20-Math.random()*this.h*.4,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.05,rot:Math.random()*6,vr:(Math.random()-.5)*.3,w:7+Math.random()*6,h:4+Math.random()*5,col:cols[i%cols.length],vida:300,f:Math.random()*6});
    }
    if(!this.raf){ const loop=()=>{ this.paso(); this.raf=this.p.length?requestAnimationFrame(loop):0; }; this.raf=requestAnimationFrame(loop); }
  },
  paso(){
    const c=this.c; c.clearRect(0,0,this.w,this.h);
    for(const p of this.p){
      p.vy+=p.g; p.vx*=.985; p.vy=Math.min(p.vy,6); p.x+=p.vx+Math.sin(p.f+=.1)*.6; p.y+=p.vy; p.rot+=p.vr; p.vida--;
      c.save(); c.translate(p.x,p.y); c.rotate(p.rot); c.scale(1,Math.cos(p.f*1.3)); c.fillStyle=p.col; c.fillRect(-p.w/2,-p.h/2,p.w,p.h); c.restore();
    }
    this.p=this.p.filter(p=>p.vida>0&&p.y<this.h+30);
    if(!this.p.length) c.clearRect(0,0,this.w,this.h);
  }
};

/* =========================================================
   BIT EN LA PANTALLA DE INICIO
   ========================================================= */
class RobotInicio{
  constructor(cv){ this.cv=cv; this.c=cv.getContext('2d'); this.vivo=false; this.ang=180; this.hop=0; this.sq=0; this.expr='normal'; this.saludo=0; this.mirar={x:0,y:0};
    this.sigAccion=2.5; this.sigParp=1.5; this.finParp=0; this.salto=null; this.giro=null; this.chispas=[]; }
  iniciar(){ this.vivo=true; const loop=ts=>{ if(!this.vivo) return; this.frame(ts/1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  parar(){ this.vivo=false; }
  saltar(){ this.salto={ini:performance.now()/1000,dur:.9}; this.expr='feliz'; this.saludo=1;
    for(let i=0;i<14;i++){ const a=Math.random()*Math.PI*2; this.chispas.push({x:0,y:-.45,vx:Math.cos(a)*1.4,vy:Math.sin(a)*1.4-1,vida:1,col:['#ffd43b','#ff6b9a','#4dabf7','#69db7c'][i%4]}); }
    setTimeout(()=>{ this.expr='normal'; this.saludo=0; },1500); }
  frame(t){
    const b=this.cv.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
    const w=Math.round(b.width), h=Math.round(b.height); if(w<20) return;
    if(this.cv.width!==w*dpr){ this.cv.width=w*dpr; this.cv.height=h*dpr; }
    const c=this.c; c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
    if(t>this.sigParp){ this.finParp=t+.14; this.sigParp=t+2+Math.random()*2.5; }
    if(t>this.sigAccion){
      const r=Math.random();
      if(r<.3){ const a0=this.ang, a1=this.ang+(Math.random()<.5?90:-90); this.giro={ini:t,dur:.45,a0,a1,vuelta:true}; }
      else if(r<.6){ this.mirar={x:(Math.random()-.5)*2,y:(Math.random()-.5)*1.4}; setTimeout(()=>{ this.mirar={x:0,y:0}; },1300); }
      else if(r<.75){ this.saludo=1; setTimeout(()=>{ this.saludo=0; },1400); }
      this.sigAccion=t+2.5+Math.random()*3;
    }
    if(this.giro){ const p=clamp((t-this.giro.ini)/this.giro.dur,0,1); this.ang=lerp(this.giro.a0,this.giro.a1,EASE.back(p));
      if(p>=1){ if(this.giro.vuelta){ this.giro={ini:t+.8,dur:.45,a0:this.giro.a1,a1:this.giro.a0,vuelta:false}; } else { this.ang=180; this.giro=null; } } }
    this.hop=0; this.sq=0;
    if(this.salto){ const p=(t-this.salto.ini)/this.salto.dur; if(p>=1) this.salto=null; else { this.hop=Math.abs(Math.sin(p*Math.PI*2)); this.sq=Math.sin(p*Math.PI*4)*-.05; } }
    const s=Math.min(w,h)*.62, cx=w/2, base=h*.6;
    // isla
    const fl=Math.sin(t*1.3)*s*.03;
    c.save(); c.translate(0,fl);
    sombraSuelo(c,cx,h*.95,s*.5,s*.05,.18);
    c.fillStyle='#8c5a30'; c.beginPath(); c.moveTo(cx-s*.62,base+s*.24); c.quadraticCurveTo(cx-s*.3,base+s*.62,cx,base+s*.78); c.quadraticCurveTo(cx+s*.3,base+s*.62,cx+s*.62,base+s*.24); c.closePath(); c.fill();
    c.fillStyle='rgba(0,0,0,.14)'; c.beginPath(); c.moveTo(cx,base+s*.3); c.quadraticCurveTo(cx+s*.3,base+s*.62,cx,base+s*.78); c.quadraticCurveTo(cx+s*.12,base+s*.5,cx,base+s*.3); c.fill();
    c.fillStyle='#4fb043'; elip(c,cx,base+s*.24,s*.64,s*.17); c.fill();
    c.fillStyle='#7fd45c'; elip(c,cx,base+s*.2,s*.62,s*.15); c.fill();
    c.fillStyle='rgba(255,255,255,.2)'; elip(c,cx-s*.2,base+s*.15,s*.25,s*.05); c.fill();
    DECO.pradera(c,3,cx-s*.42,base+s*.15,s*.5); DECO.pradera(c,2,cx+s*.45,base+s*.12,s*.42);
    // estrella flotante
    const sx=cx+s*.42, sy=base-s*.55+Math.sin(t*2.2)*s*.04;
    c.save(); c.translate(sx,sy); c.rotate(Math.sin(t*1.5)*.2);
    pathEstrella(c,0,0,s*.09,s*.042); c.fillStyle='#ffd23f'; c.fill(); c.lineWidth=s*.012; c.strokeStyle='#d98a00'; c.stroke(); c.restore();
    c.fillStyle='#fff'; c.globalAlpha=.7+.3*Math.sin(t*5); destello(c,sx-s*.12,sy-s*.06,s*.03); c.fill(); c.globalAlpha=1;
    // Bit
    const idle=(Math.sin(t*2.6)*.5+.5)*s*.03;
    dibujarRobot(c,cx,base-s*.04,s*.8,{ang:this.ang,col:colorRobot(P.color),expr:this.expr,t,hop:this.hop*s*.3+idle,sq:this.sq,parp:t<this.finParp,mirar:this.mirar,saludo:this.saludo,motor:!!this.salto});
    for(const p of this.chispas){ p.x+=p.vx*.016; p.y+=p.vy*.016; p.vy+=2*.016; p.vida-=.016;
      c.globalAlpha=clamp(p.vida,0,1); c.fillStyle=p.col; pathEstrella(c,cx+p.x*s,base+p.y*s,s*.03,s*.014); c.fill(); }
    c.globalAlpha=1; this.chispas=this.chispas.filter(p=>p.vida>0);
    c.restore();
  }
}

function toast(msg,ms){
  if($$('#toasts .toast').some(x=>x.textContent===msg)) return;
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  $('#toasts').appendChild(t);
  setTimeout(()=>{ t.classList.add('fuera'); setTimeout(()=>t.remove(),400); }, ms||2800);
}

const vista=$('#vista');

function ir(p,params,reemplazar){
  const st={p,params:params||{}};
  if(reemplazar) history.replaceState(st,''); else history.pushState(st,'');
  mostrar(st);
}
function mostrar(st){
  detenerJuego(); cerrarModal(); MANO.ocultar(); VOZ.callar();
  if(roboHome){ roboHome.parar(); roboHome=null; }
  const pr=st.params||{}; vistaActual=st.p;
  document.body.classList.toggle('en-juego',st.p==='juego');
  const m=(st.p==='mundo'||st.p==='juego')?MUNDOS[(pr.n||pr.mundo)-1]:null;
  const tema=m?m.tema:'menu';
  document.body.dataset.tema=tema;
  ['mc1','mc2','mD'].forEach(k=>{ if(m) document.body.style.setProperty('--'+k,m[k]); else document.body.style.removeProperty('--'+k); });
  ponerMotas(tema); SND.tema(tema);
  if(st.p==='login') vLogin();
  else if(st.p==='mapa') vMapa();
  else if(st.p==='mundo') vMundo(pr.n|0);
  else if(st.p==='juego') arrancarJuego(pr.mundo|0,pr.modo,pr.idx|0);
  else if(st.p==='hof') vHof();
  else { vistaActual='home'; vHome(); }
  vista.classList.remove('entra'); void vista.offsetWidth; vista.classList.add('entra');
  window.scrollTo(0,0);
}
window.addEventListener('popstate',e=>mostrar(e.state||{p:'home',params:{}}));
function ponerMotas(tema){
  if(motasTema===tema) return; motasTema=tema;
  const n=tema==='desierto'?16:tema==='menu'?22:20; let h='';
  for(let i=0;i<n;i++){
    const left=Math.random()*100, y=Math.random()*75;
    const dur=tema==='menu'?3+Math.random()*4:tema==='desierto'?5+Math.random()*6:tema==='hielo'?9+Math.random()*10:11+Math.random()*9;
    const top=tema==='menu'?y+'%':tema==='desierto'?'0':'-30px';
    h+=`<i class="mota" style="left:${left}%;top:${top};--y:${tema==='desierto'?y+'vh':'0px'};animation-duration:${dur.toFixed(1)}s;animation-delay:${(-Math.random()*dur).toFixed(1)}s"></i>`;
  }
  $('#motas').innerHTML=h;
}

let entrando=false;
async function hacerLogin(){
  const u=norm($('#lu').value), c=norm($('#lc').value), b=$('#bentrar');
  if(!u||!c){ SND.fx('error'); toast('Escribe tu usuario y tu clave'); return; }
  if(!iniciarFirebase()){ SND.fx('error'); toast('No hay conexión con el servidor'); return; }
  b.disabled=true; b.querySelector('span').textContent='Entrando…'; entrando=true;
  try{
    const cred=await FB.auth.signInWithEmailAndPassword(correo(u),c);
    if(!await cargarAlumno(cred.user)){ SND.fx('error'); toast('Este usuario no está dado de alta. Habla con tu maestro.'); return; }
    SND.fx('logro');
    ir('mapa',{},true);
    toast('¡Hola, '+primerNombre(S.user.nombre)+'! 👋');
  }catch(e){
    SND.fx('error');
    const cod=e&&e.code||'';
    toast(/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(cod)?'Usuario o clave incorrectos'
      :/too-many-requests/.test(cod)?'Demasiados intentos. Espera un minuto y prueba otra vez.'
      :/network/.test(cod)?'No hay conexión con el servidor':'No se pudo entrar. Prueba otra vez.');
  }
  finally{ entrando=false; const bb=$('#bentrar'); if(bb){ bb.disabled=false; bb.querySelector('span').textContent='Entrar'; } }
}

// Salón de la fama: «todo el cole» lee 10 documentos por tabla; «mi clase» lee la clase una vez (≈25) y sirve para todas las tablas
async function datosHof(clase,n,tipo){
  const campo=(tipo==='est'?'e':'r')+n, fresco=k=>hofCache[k]&&Date.now()-hofCache[k].t<60000;
  if(!iniciarFirebase()) throw new Error('sin_firebase');
  if(clase){
    const k='c|'+clase;
    if(!fresco(k)){ const q=await FB.db.collection('publico').where('c','==',clase).get(); hofCache[k]={t:Date.now(),filas:q.docs.map(d=>d.data())}; }
    return hofCache[k].filas.filter(r=>(r[campo]|0)>0).sort((a,b)=>b[campo]-a[campo]).slice(0,10).map(r=>({u:r.u,c:r.c,v:r[campo]}));
  }
  const k='t|'+campo;
  if(!fresco(k)){ const q=await FB.db.collection('publico').where(campo,'>',0).orderBy(campo,'desc').limit(10).get(); hofCache[k]={t:Date.now(),filas:q.docs.map(d=>{ const r=d.data(); return {u:r.u,c:r.c,v:r[campo]}; })}; }
  return hofCache[k].filas;
}
async function cargarHof(){
  const clase=(hofSt.a==='clase'&&S.user)?S.user.clase:'', pedido=JSON.stringify(hofSt);
  let filas;
  try{ filas=await datosHof(clase,hofSt.n,hofSt.tipo); }
  catch(e){ const el=$('#hof-cont'); if(el) el.innerHTML=`<div class="vacio"><img src="${avatarRobot(P.color,110,'triste')}" alt="">No se pudo cargar. Comprueba la conexión.</div>`; return; }

}

/* ---------- el programa ---------- */
function buscar(arr,id){
  for(let i=0;i<arr.length;i++){ const n=arr[i]; if(n.id===id) return {nodo:n,arr,i}; if(n.t==='REP'){ const r=buscar(n.body,id); if(r) return r; } }
  return null;
}
function buscarCuerpo(arr,body){
  for(let i=0;i<arr.length;i++){ const n=arr[i]; if(n.t==='REP'){ if(n.body===body) return {nodo:n,arr,i}; const r=buscarCuerpo(n.body,body); if(r) return r; } }
  return null;
}
function renderPila(){
  const pila=$('#pila'); if(!pila||!G) return;
  const cursorVisible=!G.corriendo;
  const x=n=>G.sel===n.id&&!G.corriendo?'<button class="x" data-acc="quitarSel" aria-label="Quitar este bloque">×</button>':'';
  const extra=n=>(G.sel===n.id?' sel':'')+(G.nuevo===n.id?' nuevo':'')+(G.marca&&G.marca.id===n.id?' '+G.marca.cls:'');
  const blq=n=>`<div class="blk b-${n.t}${extra(n)}" data-id="${n.id}"><span class="ico">${ICO[n.t]}</span><span>${CORTO[n.t]}</span>${x(n)}</div>`;
  const repH=n=>{ const dentro=cursorVisible&&G.cur.arr===n.body;
    return `<div class="rep${G.sel===n.id?' sel':''}${G.nuevo===n.id?' nuevo':''}" data-id="${n.id}">
      <div class="blk rep-cab b-REP${G.marca&&G.marca.id===n.id?' '+G.marca.cls:''}" data-cab="${n.id}"><span class="ico">${ICO.REP}</span><span>Repetir</span>
        <span class="veces"><button data-acc="menos" data-id="${n.id}" aria-label="Menos veces">−</button><b>${n.n}</b><button data-acc="mas" data-id="${n.id}" aria-label="Más veces">+</button></span><span>veces</span>
        <span class="vuelta" data-vuelta="${n.id}"></span>${x(n)}</div>
      <div class="rep-cuerpo${dentro?' dentro':''}" data-cuerpo="${n.id}">${lista(n.body)}${n.body.length?'':'<span class="vacio-prog">👆 Toca aquí y añade bloques dentro</span>'}</div>
      <div class="rep-pie"></div></div>`; };
  const lista=arr=>{ let h=''; arr.forEach((n,i)=>{ if(cursorVisible&&G.cur.arr===arr&&G.cur.i===i) h+='<div class="cursor"></div>'; h+=n.t==='REP'?repH(n):blq(n); });
    if(cursorVisible&&G.cur.arr===arr&&G.cur.i===arr.length) h+='<div class="cursor"></div>'; return h; };
  pila.innerHTML=`<div class="blk hat"><span class="ico">${ICO.play}</span><span>Al pulsar Ejecutar</span></div>`+lista(G.prog)+
    (G.prog.length?'':'<div class="vacio-prog">Toca un bloque de la caja para empezar 👈</div>');
  G.nuevo=null;
  const n=contar(G.prog), c=$('#contador');
  if(c){ c.textContent=n+(n===1?' bloque':' bloques')+(n>=MAX_BLOQUES-8?' / '+MAX_BLOQUES:''); c.className='chip contador'+(G.modo==='fijo'&&n?(n<=G.lab.par?' ok':' sobra'):''); }
  $$('#paleta .blk').forEach(b=>b.classList.toggle('off',b.dataset.t==='REP'&&G.cur.arr!==G.prog));
}
function scrollSuave(el){
  const a=$('#area'); if(!a||!el) return;
  const r=el.getBoundingClientRect(), ra=a.getBoundingClientRect();
  if(r.top<ra.top+8||r.bottom>ra.bottom-8) a.scrollTo({top:a.scrollTop+(r.top-ra.top)-ra.height/2+r.height/2,behavior:'smooth'});
}
function añadir(t){
  if(!G||G.corriendo) return;
  const M=MUNDOS[G.mundo-1]; if(!M.bloques.includes(t)) return;
  if(contar(G.prog)>=MAX_BLOQUES){ SND.fx('error'); toast('¡Ya no caben más bloques! (máximo '+MAX_BLOQUES+')'); return; }
  if(t==='REP'&&G.cur.arr!==G.prog){ SND.fx('error'); toast('Un Repetir no puede ir dentro de otro Repetir'); return; }
  const nn=t==='REP'?rep(2,[]):nodo(t);
  G.cur.arr.splice(G.cur.i,0,nn);
  if(t==='REP') G.cur={arr:nn.body,i:0}; else G.cur.i++;
  G.sel=null; G.nuevo=nn.id; G.marca=null;
  SND.fx('add',t); renderPila();
  scrollSuave(document.querySelector(`#pila [data-id="${nn.id}"]`));
  if(t==='REP') decir('¡Repetir añadido! Ahora toca los bloques que quieras meter dentro. Cuando acabes, toca fuera del Repetir.');
  if(G.tuto===1){ G.tuto=2; MANO.mostrar('#brun'); decir('¡Muy bien! Añade los bloques que falten y luego pulsa «¡Ejecutar!» para ver qué hago.'); }
}
function quitarNodo(r){
  r.arr.splice(r.i,1);
  if(r.nodo.t==='REP'&&(G.cur.arr===r.nodo.body||buscarCuerpo(r.nodo.body,G.cur.arr))) G.cur={arr:r.arr,i:r.i};
  else if(G.cur.arr===r.arr&&G.cur.i>r.i) G.cur.i--;
}
function quitar(){
  if(!G||G.corriendo) return;
  if(G.sel){ const r=buscar(G.prog,G.sel); if(r) quitarNodo(r); G.sel=null; }
  else if(G.cur.i>0){ quitarNodo({nodo:G.cur.arr[G.cur.i-1],arr:G.cur.arr,i:G.cur.i-1}); }
  else if(G.cur.arr!==G.prog){ const pd=buscarCuerpo(G.prog,G.cur.arr); if(pd){ if(!pd.nodo.body.length) quitarNodo(pd); else G.cur={arr:pd.arr,i:pd.i}; } }
  else { SND.fx('error'); return; }
  G.marca=null; SND.fx('quitar'); renderPila();
}
function clickArea(e){
  if(!G||G.corriendo) return;
  const t=e.target;
  if(t.closest('.hat')){ G.cur={arr:G.prog,i:0}; G.sel=null; SND.fx('tap'); renderPila(); return; }
  const cab=t.closest('.rep-cab');
  if(cab){ const r=buscar(G.prog,cab.dataset.cab); if(r){ G.sel=G.sel===r.nodo.id?null:r.nodo.id; G.cur={arr:r.arr,i:r.i+1}; } SND.fx('tap'); renderPila(); return; }
  const b=t.closest('.blk[data-id]');
  if(b){ const r=buscar(G.prog,b.dataset.id); if(r){ G.sel=G.sel===r.nodo.id?null:r.nodo.id; G.cur={arr:r.arr,i:r.i+1}; } SND.fx('tap'); renderPila(); return; }
  const cu=t.closest('.rep-cuerpo');
  if(cu){ const r=buscar(G.prog,cu.dataset.cuerpo); if(r){ G.cur={arr:r.nodo.body,i:r.nodo.body.length}; G.sel=null; } SND.fx('tap'); renderPila(); return; }
  G.cur={arr:G.prog,i:G.prog.length}; G.sel=null; renderPila();
}

/* ---------- ejecución ---------- */
function aplanarInfo(prog,reps,out){
  out=out||[]; reps=reps||[];
  for(const n of prog){ if(n.t==='REP'){ for(let k=0;k<n.n;k++) aplanarInfo(n.body,reps.concat([{id:n.id,k,n:n.n}]),out); } else out.push({t:n.t,id:n.id,reps}); }
  return out;
}
function estadoCtrl(){
  if(!G) return;
  const j=$('#juego'), br=$('#brun'), bp=$('#bpaso'); if(!br) return;
  j.classList.toggle('corriendo',G.corriendo);
  if(G.corriendo&&!G.paso){ br.classList.add('parar'); br.innerHTML=ICO.stop+'<span>Parar</span>'; }
  else if(G.corriendo&&G.paso){ br.classList.remove('parar'); br.innerHTML=ICO.play+'<span>Seguir solo</span>'; }
  else { br.classList.remove('parar'); br.innerHTML=ICO.play+'<span>¡Ejecutar!</span>'; }
  bp.querySelector('span').textContent=(G.corriendo&&G.paso)?'Siguiente':'Paso a paso';
  bp.classList.toggle('resalta',G.corriendo&&G.paso);
}
function esperarPaso(){ return new Promise(res=>{ G.resolverPaso=res; }); }
function liberarPaso(){ if(G&&G.resolverPaso){ const r=G.resolverPaso; G.resolverPaso=null; r(); } }
function marcarBloque(p,cls){
  $$('#pila .exec,#pila .siguiente').forEach(e=>e.classList.remove('exec','siguiente'));
  $$('#pila .vuelta.ver').forEach(v=>{ if(!p.reps.some(r=>r.id===v.dataset.vuelta)) v.classList.remove('ver'); });
  p.reps.forEach(r=>{ const v=document.querySelector(`[data-vuelta="${r.id}"]`); if(v){ v.textContent=`vuelta ${r.k+1} de ${r.n}`; v.classList.add('ver'); } });
  const el=document.querySelector(`#pila .blk[data-id="${p.id}"]`); if(el){ el.classList.add(cls); scrollSuave(el); }
}
async function ejecutar(modoPaso){
  if(!G) return;
  if(G.corriendo){ if(G.paso&&!modoPaso){ G.paso=false; estadoCtrl(); liberarPaso(); } return; }
  if(!G.prog.length){ SND.fx('error'); decir('Tu programa está vacío. Toca los bloques de la caja para darme órdenes.','mal'); resaltarPaleta(); return; }
  const pasos=aplanarInfo(G.prog);
  if(!pasos.length){ SND.fx('error'); decir('Tu «Repetir» está vacío: mete bloques dentro.','mal'); return; }
  MANO.ocultar(); if(G.tuto) G.tuto=3;
  const id=++G.runId; G.corriendo=true; G.paso=!!modoPaso; G.sel=null; G.marca=null;
  renderPila(); estadoCtrl(); tab.reset();
  SND.fx('run');
  decir(modoPaso?'Paso a paso: pulsa «Siguiente» para cada orden. Si quieres que siga solo, pulsa «Seguir solo».':'¡Allá voy! 🚀');
  const est={x:G.lab.ini.x,y:G.lab.ini.y,d:G.lab.ini.dir};
  await espera(260);
  for(let i=0;i<pasos.length;i++){
    if(!G||id!==G.runId) return;
    const p=pasos[i];
    if(G.paso){ marcarBloque(p,'siguiente'); await esperarPaso(); if(!G||id!==G.runId) return; }
    marcarBloque(p,'exec');
    const r=dar(est,p.t,G.lab);
    if(r==='choque'){ SND.fx('choque'); vibrar(90); await tab.chocar(); return fin(id,'choque',p); }
    if(p.t==='F'){ SND.fx('paso',i); await tab.mover(est.x,est.y,vel()); }
    else { SND.fx('giro',p.t==='R'); await tab.girar(p.t==='R',vel()); }
    if(!G||id!==G.runId) return;
    if(r==='meta') return victoria(id);
  }
  fin(id,'fin');
}
function fin(id,motivo,p){
  if(!G||id!==G.runId) return;
  G.corriendo=false; G.paso=false;
  if(motivo==='choque'){ G.marca={id:p.id,cls:'choca'}; decir('¡Ay! Ahí no hay camino 💥 El bloque en rojo me hizo chocar. Cámbialo y vuelve a probar.','mal'); }
  else { tab.dudar(); SND.fx('fallo'); decir('Se acabaron las órdenes y no he llegado a la estrella. ¡Te faltan bloques!','mal'); }
  renderPila(); estadoCtrl();
  if(G.modo==='inf'&&rachaSes>0){ toast('Has perdido la racha de '+rachaSes+' 😅'); rachaSes=0; pintarChips(); }
}
function parar(msg){
  if(!G) return;
  G.runId++; G.corriendo=false; G.paso=false; liberarPaso(); G.marca=null;
  if(tab) tab.reset(); renderPila(); estadoCtrl();
  if(msg!==false) decir('Programa detenido. Cámbialo si quieres y vuelve a ejecutar.');
}
async function victoria(id){
  $$('#pila .exec').forEach(e=>e.classList.remove('exec'));
  SND.fx('meta');
  await tab.celebrar();
  if(!G||id!==G.runId) return;
  G.corriendo=false; G.paso=false; renderPila(); estadoCtrl();
  CONFETI.lanzar(150);
  const bl=contar(G.prog), par=G.lab.par, est=estrellas(bl,par), p=S.prog[G.mundo];
  if(G.tuto){ P.tutos.w1=true; guardarPrefs(); G.tuto=0; }
  if(G.modo==='fijo'){
    const antes=p.s[G.idx], mejora=est>antes;
    if(mejora){ p.s[G.idx]=est; guardarPerfil(); programarSync(2500); }
    pintarChips();
    decir(est===3?'¡Perfecto! ⭐⭐⭐ ¡Eres un genio de la programación!':'¡Lo conseguiste! ¿Te atreves a hacerlo con menos bloques?','bien');
    modalVictoria(est,bl,par,mejora&&antes>0);
  } else {
    rachaSes++; let rec=false;
    if(rachaSes>p.r){ p.r=rachaSes; rec=true; guardarPerfil(); programarSync(8000); }
    pintarChips();
    const hito=HITOS_RACHA.includes(rachaSes);
    if(hito){ setTimeout(()=>{ SND.fx('logro'); CONFETI.lanzar(220); },500); } else SND.fx('racha');
    decir(`¡Racha de ${rachaSes}! 🔥`,'bien');
    modal({titulo:hito?`¡Racha de ${rachaSes}! 🔥`:'¡Correcto!',robot:'feliz',
      html:`<div class="stats"><span class="stat">🔥 Racha: <b>${rachaSes}</b></span><span class="stat">${rec?'🏆 <b>¡Nuevo récord!</b>':'🏆 Récord: <b>'+p.r+'</b>'}</span><span class="stat">🧩 Bloques: <b>${bl}</b></span></div>${hito?'<p>¡Eres una máquina de programar!</p>':''}`,
      botones:[{txt:'Siguiente laberinto',cls:'btn-ok',ico:ICO.play,fn:()=>arrancarJuego(G.mundo,'inf',0)},{txt:'Volver al mundo',cls:'btn-gris',ico:ICO.casa,fn:()=>history.back()}]});
  }
}
function modalVictoria(est,bl,par,mejora){
  const ult=G.idx>=RETOS-1;
  const txt=est===3?`¡Perfecto! Lo has hecho con <b>${bl}</b> ${bl===1?'bloque':'bloques'}.`:`Has usado <b>${bl}</b> bloques. Con <b>${par}</b> o menos consigues las 3 estrellas.`;
  const botones=[];
  if(!ult) botones.push({txt:'Siguiente reto',cls:'btn-ok',ico:ICO.play,fn:()=>pasarA('fijo',G.idx+1)});
  else botones.push({txt:'¡Al modo infinito!',cls:'btn-pri',ico:ICO.dado,fn:()=>{ rachaSes=0; pasarA('inf',0); }});
  if(est<3) botones.push({txt:'Mejorar mi programa',cls:'btn-oro',ico:ICO.reiniciar,fn:()=>{ tab.reset(); decir(`Intenta llegar con ${par} bloques o menos. Puedes tocar un bloque para borrarlo.`,'pista'); }});
  else botones.push({txt:'Repetir este reto',cls:'btn-gris',ico:ICO.reiniciar,fn:()=>arrancarJuego(G.mundo,'fijo',G.idx)});
  botones.push({txt:'Volver al mundo',cls:'btn-gris',ico:ICO.casa,fn:()=>history.back()});
  modal({titulo:est===3?'¡Increíble!':est===2?'¡Muy bien!':'¡Conseguido!',
    html:`<div class="estrellas-grandes">${[0,1,2].map(i=>`<span class="e" data-i="${i}">${ICO.estrella}</span>`).join('')}</div><p>${txt}</p>${mejora?'<p>🎉 ¡Has mejorado tu marca!</p>':''}`,botones});
  [0,1,2].forEach(i=>setTimeout(()=>{ const e=$(`#modal .e[data-i="${i}"]`); if(!e) return; if(i<est){ e.classList.add('on'); SND.fx('estrella',i); } else e.classList.add('gris'); },450+i*380));
}
function pasarA(modo,idx){
  const params={mundo:G.mundo,modo,idx};
  history.replaceState({p:'juego',params},'');
  arrancarJuego(params.mundo,modo,idx);
}
function resaltarPaleta(){ $$('#paleta .blk').forEach(b=>{ b.classList.add('resalta'); setTimeout(()=>b.classList.remove('resalta'),2400); }); }

/* ---------- pistas ---------- */
function pista(){
  if(!G||G.corriendo) return;
  G.pistas++; SND.fx('pista');
  const lab=G.lab, est={x:lab.ini.x,y:lab.ini.y,d:lab.ini.dir};
  for(const p of aplanarInfo(G.prog)){
    const r=dar(est,p.t,lab);
    if(r==='choque'){ G.marca={id:p.id,cls:'marcado'}; renderPila(); scrollSuave(document.querySelector(`#pila [data-id="${p.id}"]`));
      decir(`💡 Mira el bloque «${CORTO[p.t]}» que parpadea: con él me choco. Cámbialo o bórralo.`,'pista'); return; }
    if(r==='meta'){
      if(contar(G.prog)>lab.par) decir(G.mundo===3?`💡 ¡Tu programa funciona! Para ★★★ usa ${lab.par} bloques o menos: busca lo que se repite y mételo en «Repetir».`:`💡 ¡Tu programa funciona! Pero sobran bloques: con ${lab.par} es suficiente.`,'pista');
      else decir('💡 ¡Tu programa ya funciona! Pulsa «¡Ejecutar!» y mira.','pista');
      return;
    }
  }
  const k=lab.path.findIndex(([x,y])=>x===est.x&&y===est.y), sig=lab.path[k+1];
  if(k<0||!sig) return;
  const dn=[0,1,2,3].find(d=>est.x+DX[d]===sig[0]&&est.y+DY[d]===sig[1]);
  const acc=dn===est.d?'F':dn===(est.d+1)%4?'R':dn===(est.d+3)%4?'L':'LL';
  tab.marca=sig; setTimeout(()=>{ if(tab) tab.marca=null; },4500);
  const pre=G.prog.length?'Después de tu programa, ':'Para empezar, ';
  const txt={F:`${pre}tengo el camino justo delante: añade «Avanzar».`,
             R:`${pre}el camino sigue a MI derecha (la derecha de Bit): añade «Girar derecha».`,
             L:`${pre}el camino sigue a MI izquierda (la izquierda de Bit): añade «Girar izquierda».`,
             LL:`${pre}tengo que darme la vuelta: gira dos veces.`}[acc];
  let extra='';
  if(G.mundo===3&&G.pistas>=2){ const rp=lab.ref.find(n=>n.t==='REP'); if(rp) extra=` Truco: «Repetir ${rp.n} veces» con ${rp.body.map(b=>'«'+CORTO[b.t]+'»').join(' + ')} dentro.`; }
  decir('💡 '+txt+extra,'pista');
  const b=$(`#paleta [data-t="${acc==='LL'?'L':acc}"]`); if(b){ b.classList.add('resalta'); setTimeout(()=>b.classList.remove('resalta'),2600); }
}

/* =========================================================
   ACCIONES
   ========================================================= */
const ACC = {
  atras(){ SND.fx('whoosh'); history.back(); },
  sfx(){ SND.setSfx(!P.sfx); actualizarSonido(); SND.fx('tap'); },
  mus(){ SND.setMusica(!P.mus); actualizarSonido(); },
  libre(){ SND.fx('tap'); cargarPerfil(); ir('mapa'); },
  async instalar(){ if(!avisoInstalar) return; SND.fx('tap'); avisoInstalar.prompt(); try{ await avisoInstalar.userChoice; }catch(e){} avisoInstalar=null; const b=$('#binst'); if(b) b.hidden=true; },
  login(){ SND.fx('tap'); ir('login'); },
  entrar(){ hacerLogin(); },
  ojo(b){ const i=$('#lc'), ver=i.type==='password'; i.type=ver?'text':'password'; b.innerHTML=ver?ICO.ojoNo:ICO.ojo; },
  jugar(){ SND.fx('tap'); ir('mapa'); },
  salir(){ SND.fx('whoosh'); cerrarSesion(); vHome(); },
  salir2(){ SND.fx('whoosh'); cerrarSesion(); ir('home',{},true); },
  hof(){ SND.fx('tap'); ir('hof'); },
  hofnivel(b){ SND.fx('tap'); hofSt.n=+b.dataset.n; pintarHofBase(); cargarHof(); },
  hoftipo(b){ SND.fx('tap'); hofSt.tipo=b.dataset.t; pintarHofBase(); cargarHof(); },
  hofambito(b){ SND.fx('tap'); hofSt.a=b.dataset.a; pintarHofBase(); cargarHof(); },
  mundo(b){ SND.fx('whoosh'); ir('mundo',{n:+b.dataset.n}); },
  reto(b){ SND.fx('pop'); ir('juego',{mundo:+b.dataset.n,modo:'fijo',idx:+b.dataset.i}); },
  inf(b){ SND.fx('pop'); rachaSes=0; ir('juego',{mundo:+b.dataset.n,modo:'inf',idx:0}); },
  color(b){ P.color=b.dataset.c; guardarPrefs(); $$('.colores button').forEach(x=>x.classList.toggle('on',x===b)); SND.fx('color'); if(roboHome) roboHome.saltar(); globo('¡Me encanta este color! 🎨'); },
  bit(){ if(!roboHome) return; roboHome.saltar(); SND.fx('boing'); globo(FRASES[Math.floor(Math.random()*FRASES.length)]); },
  borrar(){
    modal({titulo:'¿Borrar tu progreso?',robot:'triste',cancelable:true,html:'<p>Se borrarán las estrellas y rachas guardadas en este ordenador.</p>',botones:[
      {txt:'Sí, borrar',cls:'btn-rojo',fn:()=>{ S.prog=normalizarProg({}); S.pend=false; guardarPerfil(); vMapa(); toast('Progreso borrado'); }},
      {txt:'No, cancelar',cls:'btn-gris'}]});
  },
  add(b){ añadir(b.dataset.t); },
  quitar(){ quitar(); },
  quitarSel(){ quitar(); },
  vaciar(){
    if(!G||G.corriendo) return;
    if(!G.prog.length){ SND.fx('error'); return; }
    const hacer=()=>{ G.prog.length=0; G.cur={arr:G.prog,i:0}; G.sel=null; G.marca=null; SND.fx('vaciar'); renderPila(); };
    if(contar(G.prog)<3){ hacer(); return; }
    modal({titulo:'¿Borrar todo el programa?',robot:'sorpresa',cancelable:true,html:'<p>Se quitarán todos los bloques.</p>',botones:[{txt:'Sí, borrar todo',cls:'btn-rojo',ico:ICO.papelera,fn:hacer},{txt:'No, cancelar',cls:'btn-gris'}]});
  },
  menos(b){ if(!G||G.corriendo) return; const r=buscar(G.prog,b.dataset.id); if(r&&r.nodo.n>2){ r.nodo.n--; SND.fx('add','L'); renderPila(); } else SND.fx('error'); },
  mas(b){ if(!G||G.corriendo) return; const r=buscar(G.prog,b.dataset.id); if(r&&r.nodo.n<12){ r.nodo.n++; SND.fx('add','R'); renderPila(); } else SND.fx('error'); },
  run(){ if(!G) return; if(G.corriendo&&!G.paso){ SND.fx('tap'); parar(); } else ejecutar(false); },
  paso(){ if(!G) return; if(!G.corriendo) ejecutar(true); else if(G.paso) liberarPaso(); else { G.paso=true; estadoCtrl(); } },
  reiniciar(){ if(!G) return; SND.fx('whoosh'); if(G.corriendo) parar(false); else { G.marca=null; tab.reset(); renderPila(); } decir('¡De vuelta a la salida!'); },
  vel(b){ P.vel=(P.vel+1)%VELOCIDADES.length; guardarPrefs(); const v=VELOCIDADES[P.vel]; b.innerHTML=`<span class="em">${v.em}</span><span>${v.n}</span>`; SND.fx('tap'); },
  pista(){ pista(); },
  voz(){ if(G) VOZ.decir(G.msg); },
  otro(){
    if(!G||G.corriendo) return;
    const nuevo=()=>{ if(rachaSes>0) toast('Has perdido la racha 😅'); rachaSes=0; SND.fx('whoosh'); arrancarJuego(G.mundo,'inf',0); };
    if(rachaSes>0) modal({titulo:'¿Saltar este laberinto?',robot:'triste',cancelable:true,html:`<p>Si saltas, pierdes tu racha de <b>${rachaSes}</b>.</p>`,botones:[{txt:'Sí, saltar',cls:'btn-rojo',fn:nuevo},{txt:'No, me quedo',cls:'btn-gris'}]});
    else nuevo();
  }
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-acc]');
  if(b){ const f=ACC[b.dataset.acc]; if(f) f(b,e); return; }
  if(G&&vistaActual==='juego'&&e.target.closest('#area')) clickArea(e);
});
document.addEventListener('keydown',e=>{
  if(modalAbierto()){ if(e.key==='Escape'&&modalCancelable) cerrarModal(); return; }
  if(vistaActual!=='juego'||!G) return;
  if(e.target.closest&&e.target.closest('input,textarea')) return;
  const mapa={ArrowUp:'F',ArrowLeft:'L',ArrowRight:'R',r:'REP',R:'REP'};
  const k=e.key;
  if(mapa[k]){ e.preventDefault(); añadir(mapa[k]); }
  else if(k==='Backspace'||k==='Delete'){ e.preventDefault(); quitar(); }
  else if((k==='Enter'||k===' ')&&!(e.target.closest&&e.target.closest('button'))){ e.preventDefault(); ACC.run(); }
  else if(k==='Escape'&&G.corriendo){ parar(); }
});

/* =========================================================
   ARRANQUE
   ========================================================= */
(function(){
  VOZ.init();
  cargarPerfil();
  history.replaceState({p:'home',params:{}},'');
  mostrar({p:'home',params:{}});
  const fb=iniciarFirebase();
  if(fb) fb.auth.onAuthStateChanged(async user=>{
    if(!user||S.user||entrando) return;
    try{ if(await cargarAlumno(user)&&vistaActual==='home') vHome(); }catch(e){}
  });
  const despertar=()=>SND.despertar();
  document.addEventListener('pointerdown',despertar,{once:true});
  document.addEventListener('keydown',despertar,{once:true});
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') sincronizar(); });
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ for(const k in _avatares) delete _avatares[k]; });
})();
</script>
